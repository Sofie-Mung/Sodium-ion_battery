# models_registry.yml — MODEL_BENCHMARK_SPEC 관문 0 레지스트리 (조사 2026-09-17)
# status: verified   = v3/v4 프로덕션 또는 표준 배포로 검증됨
#         unverified = 어댑터 작성됨, 체크포인트명/화폐/호출부는 팟 첫 실행에서 확인 필요
#         blocked    = 공개 ASE 인터페이스 미확인 — 실행 불가로 끝날 수 있음 (§10-6: 결과 표에 남김)
# currency 판정: 마무리(마지막 fine-tune) 데이터가 MPtrj/sAlex(PBE+U) 계열이면 MP.
# adapter 키는 bench_models.ADAPTERS와 1:1. isolated: true = 자체 torch/python venv 필요.
# engine (2026-09-30): 전 모델에 torch-sim 배치 경로 추가 (bench_models.build_ts / TS_PIP).
#   torch-sim-atomistic==0.5.2 고정 (0.6.x는 nvalchemi[torch] 경유로 torch>=2.8 요구 -> eSEN 2.4 / EqV3 2.7.1 불가).
#   MatterSim만 자체 의존성으로 >=0.6 설치 (fire.py·cell_filters.py 알고리즘 동일 확인).
#   네이티브: ORB(torch_sim.models.orb), MACE(torch_sim.models.mace), SevenNet(sevenn.torchsim),
#             MatterSim(mattersim.torchsim), TECE(tace.interface.torchsim), PET(metatomic_torchsim)
#   직접 래퍼: OCPBatchModel(M05/M06/M09 - OCPCalculator의 a2g+trainer.predict 배치),
#             CHGNetBatchModel(M08), ProphetBatchModel(M10)
#   스모크 8-10(배치==ASE, torch-sim 이완, 배치 타이밍) 통과 모델만 torchsim, 나머지는 ASE로 실행.

- id: M01
  adapter: orb_mpa
  name: ORB-v3 conservative mpa
  checkpoint: orb_v3_conservative_inf_mpa (orb_models.forcefield.pretrained, 자동 다운로드)
  lineage: 비등변 (graph attention)
  currency: MP (MPtrj + sAlex) — 프로덕션과 동일 은행
  conservative: true
  license: Apache-2.0
  pip: ["orb-models==0.5.5"]   # 2026-09-29: py3.12 전용 venv + torch 2.8.0 cu126 (09-17엔 공유 env에서 adapter_error)
  isolated: true
  status: unverified   # 0.5.5 API 확인(wheel 소스), 팟 smoke 대기
  role: 기준선 (현행 주모델)

- id: M02
  adapter: orb_omat
  name: ORB-v3 conservative omat
  checkpoint: orb_v3_conservative_inf_omat
  lineage: 비등변 (M01과 동일 아키텍처)
  currency: OMat24 (PBE+U, VASP 54 · 다른 PSP 세트 — MP2020 보정과 비호환) → 관문 0에서 대조군 확정
  conservative: true
  license: Apache-2.0
  pip: ["orb-models==0.5.5"]   # M01과 같은 venv 구성
  isolated: true
  status: unverified
  role: 화폐 대조군 — "화폐 불일치가 dE에 주는 영향"을 답하는 참가자

- id: M03
  adapter: mace_mpa
  name: MACE-MPA-0 (medium)
  checkpoint: medium-mpa-0 (mace_mp 자동 다운로드)
  lineage: 등변 (e3nn)
  currency: MP (MPtrj + sAlex)
  conservative: true
  license: MIT (코드) / 체크포인트 카드 재확인
  pip: [mace-torch]
  isolated: false
  status: verified
  role: 현행 대조모델

- id: M04
  adapter: sevennet_omni
  name: SevenNet-Omni (MPA 헤드)   # 2026-09-29 MF-ompa에서 교체, Omni만 사용(폴백 없음)
  checkpoint: 7net-omni, modal="mpa" — 다른 헤드(r2SCAN·omat·omol 등)는 화폐 다름, modal 인자 필수
  lineage: 등변 (NequIP 계열, 다중태스크 — 공개 데이터셋 15개)
  currency: MP (mpa 헤드 = PBE+U 라벨)
  conservative: true
  license: GPL-3.0 (연구·논문 사용 무관)
  pip: [sevenn]
  isolated: false
  status: unverified   # 체크포인트 키워드(7net-omni)·modal 이름 확인
  role: 등변·다중태스크 계보

- id: M05
  adapter: esen_30m_oam
  name: eSEN-30M-OAM
  checkpoint: hf.co/facebook/OMAT24 esen_30m_oam.pt — gated(수동 승인) → HF_TOKEN 필수
  loader: fairchem-core==1.10.0 OCPCalculator(checkpoint_path, cpu=False, seed=0) — v2 레지스트리엔 없음
  lineage: 등변, 대형 (30M)
  currency: MP 마무리 (OMat 사전학습 → MPtrj+sAlex)
  conservative: true   # energy-conserving 설계 — 카드 재확인
  license: Meta FAIR 연구용 — 재배포 조건 확인
  pip: ["torch==2.4.0 (cu121)", "fairchem-core[torch-extras]==1.10.0", "numpy<2", "scipy<1.15"]
  isolated: true       # py3.12 (fairchem 1.10: torch~=2.4, numpy<2, py<3.13)
  status: unverified   # HF 접근 승인 후 팟 smoke
  role: 리더보드 상위

- id: M06
  adapter: equiformer_v3_oam
  name: EquiformerV3+DeNS-OAM
  checkpoint: hf.co/mirror-physics/equiformer_v3 (실물 확인, F1 0.912)
  lineage: 등변 (SE(3) graph attention transformer v3)
  currency: MP 마무리 주장 — 카드 확인
  conservative: unverified
  license: 저장소 확인 (atomicarchitects/equiformer_v3)
  pip: ["git clone → torch 2.7.1 cu126 + PyG → conda_requirements.txt → pip install -e packages/fairchem-core"]
  # editable 필수: setup_imports()가 심볼릭 링크로 experimental/models를 import해야 equiformer_v3가 등록됨
  isolated: true       # py3.12 (09-30: torch-sim용, 3.11->3.12) + torch 2.7.1+cu126 + PyG 스택 (README env, pip_steps)
  status: unverified   # 2026-09-18 업데이트: vendored fairchem-core 경로로 설치 가능 확인 (README env 재현).
                       # ckpt는 hf.co/mirror-physics/equiformer_v3의 checkpoint/omat24-mptrj-salex_gradient.pt
                       # (OAM 화폐 + conservative) 자동 선택. 로더 API는 팟에서 최종 확인.
  role: 리더보드 F1 상위 — vendored fairchem 경로로 참가 시도 (실패 시 '실행 불가' 행으로 보고)

