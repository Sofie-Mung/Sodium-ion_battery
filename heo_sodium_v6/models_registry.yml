- id: M10
  adapter: prophet_oame
  name: Prophet-OAME-MBD
  checkpoint: hf.co/kairosmaterial/prophet prophet-oame-mbd.pt (자동 다운로드)
  lineage: 등변, 62.3M (Kairos Materials)
  currency: MP — OMat24+ELEMENTA 사전학습 → MPtrj+sAlex 마무리 (matbench PR #397에서 확인)
  conservative: unverified
  license: MIT (코드) / CC-BY-4.0 (가중치)
  pip: ["prophet-mlip @ git+https://github.com/kairosmaterial/prophet.git@dcfdc0b143978652d573630f1d2a6ce09e0c610a", huggingface_hub]
  isolated: true       # py3.12 + torch 2.8.0 cu126 (prophet: py>=3.11, torch>=2.7, ase>=3.29)
  loader: from prophet import KairosCalculator; KairosCalculator(model_path, use_kernel=False)
          # 기본 use_kernel=True는 openequivariance JIT(nvcc) 필요 — HEO_PROPHET_KERNEL=1로만 켬
  status: unverified
  role: 신규 상위

